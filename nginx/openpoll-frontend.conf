server {
    listen 80 default_server;
    server_name www.openpoll.co.kr openpoll.co.kr;

    root /var/www/html;
    index index.html;

    # 프리렌더된 HTML 우선 서빙, 없으면 SPA 폴백
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # 정적 에셋 장기 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt, sitemap.xml 직접 서빙
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }
}
